syntax = "proto3";

package vaxcare.payment;

option java_multiple_files = true;
option java_package = "com.vaxcare.grpc.payment";
option java_outer_classname = "PaymentProto";

message CreatePaymentRequest {
  int64 appointment_id = 1;
}

message GetPaymentByAppointmentRequest {
  int64 appointment_id = 1;
}

message PaymentUrlResponse {
  string payment_url = 1;
  int64 payment_id = 2;
  string txn_ref = 3;       // VNPay
  string app_trans_id = 4;  // ZaloPay
  string order_token = 5;   // ZaloPay
}

message PaymentResponse {
  int64 payment_id = 1;
  int64 appointment_id = 2;
  string transaction_id = 3;
  string amount = 4;
  string payment_method = 5;
  string status = 6;
  string payment_time = 7;
  string created_at = 8;
}

message PaymentApiResponse {
  string timestamp = 1;
  int32 status = 2;
  string message = 3;
  oneof data {
    PaymentUrlResponse url = 4;
    PaymentResponse payment = 5;
  }
}

service PaymentService {
  rpc CreateVnpayPaymentUrl(CreatePaymentRequest) returns (PaymentApiResponse);
  rpc CreateZalopayPaymentUrl(CreatePaymentRequest) returns (PaymentApiResponse);
  rpc GetPaymentByAppointment(GetPaymentByAppointmentRequest) returns (PaymentApiResponse);
}
