syntax = "proto3";

package vaxcare.admin;

option java_multiple_files = true;
option java_package = "com.vaxcare.grpc.admin";
option java_outer_classname = "AdminAccountProto";

import "vaxcare/common/common.proto";

message SearchAccountsRequest {
  string role = 1;  
  string status = 2; 
  string keyword = 3;
}

message AccountIdRequest {
  int64 id = 1;
}

message UpdateAccountStatusRequest {
  int64 id = 1;
  string status = 2; // ACTIVE | INACTIVE | SUSPENDED | DELETED
}

message SetPasswordRequest {
  int64 id = 1;
  string new_password = 2;
}

message CreateStaffRequest {
  string email = 1;
  string password = 2;
  string phone = 3;
  string full_name = 4;
  string staff_code = 5;
  string specialty = 6;
  int64 facility_id = 7;
}

message CreateAdminRequest {
  string email = 1;
  string password = 2;
  string full_name = 3;
  string phone = 4;
  string admin_level = 5;
}

message UpdateStaffRequest {
  int64 staff_id = 1;
  string full_name = 2;
  string staff_code = 3;
  string specialty = 4;
  string phone = 5;
  int64 facility_id = 6;
}

message UpdateStaffFacilityRequest {
  int64 staff_id = 1;
  int64 facility_id = 2;
}

message AdminAccountItem {
  int64 account_id = 1;
  string email = 2;
  string phone = 3;
  string role = 4;
  string status = 5;
  string full_name = 6;
  string avatar_url = 7;
  string created_at = 8;
  string gender = 9;
  string date_of_birth = 10;
  string address = 11;
  string staff_code = 12;
  string specialty = 13;
  int64 facility_id = 14;
  string facility_name = 15;
}

message AdminAccountDetail {
  int64 account_id = 1;
  string email = 2;
  string phone = 3;
  string role = 4;
  string status = 5;
  string avatar_url = 6;
  string full_name = 7;
  string created_at = 8;
  string updated_at = 9;
  string date_of_birth = 10;
  string gender = 11;
  string address = 12;
  string staff_code = 13;
  string specialty = 14;
  int64 facility_id = 15;
  string facility_name = 16;
  string admin_level = 17;
}

message AdminAccountList {
  repeated AdminAccountItem items = 1;
}

message AdminAccountApiResponse {
  string timestamp = 1;
  int32 status = 2;
  string message = 3;
  oneof data {
    AdminAccountItem item = 4;
    AdminAccountList list = 5;
    AdminAccountDetail detail = 6;
  }
}

service AdminAccountService {
  rpc ListUsers(vaxcare.common.Empty) returns (AdminAccountApiResponse);
  rpc ListStaff(vaxcare.common.Empty) returns (AdminAccountApiResponse);
  rpc SearchAccounts(SearchAccountsRequest) returns (AdminAccountApiResponse);
  rpc GetAccountDetail(AccountIdRequest) returns (AdminAccountApiResponse);
  rpc CreateStaff(CreateStaffRequest) returns (AdminAccountApiResponse);
  rpc CreateAdmin(CreateAdminRequest) returns (AdminAccountApiResponse);
  rpc UpdateAccountStatus(UpdateAccountStatusRequest) returns (AdminAccountApiResponse);
  rpc SetPassword(SetPasswordRequest) returns (AdminAccountApiResponse);
  rpc UpdateStaff(UpdateStaffRequest) returns (AdminAccountApiResponse);
  rpc UpdateStaffFacility(UpdateStaffFacilityRequest) returns (AdminAccountApiResponse);
}
