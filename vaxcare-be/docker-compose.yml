services:
  mysql:
    image: mysql:8.0
    container_name: vaxcare-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${DB_NAME:-vaxcare_2026}
      MYSQL_USER: ${DB_USERNAME:-vaxcare}
      MYSQL_PASSWORD: ${DB_PASSWORD:-vaxcare123}
    ports:
      - "${DB_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p$$DB_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - vaxcare-network

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vaxcare-be
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${DB_NAME:-vaxcare_2026}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME:-vaxcare}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-vaxcare123}
      SERVER_PORT: ${SERVER_PORT:-8080}
      GRPC_SERVER_PORT: ${GRPC_SERVER_PORT:-9090}
      JWT_SECRET: ${JWT_SECRET:-change-this-super-secret-key-in-production}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-86400000}
    ports:
      - "${SERVER_PORT:-8080}:8080"
      - "${GRPC_SERVER_PORT:-9090}:9090"
    networks:
      - vaxcare-network

  envoy:
    image: envoyproxy/envoy:v1.31-latest
    container_name: vaxcare-envoy
    restart: unless-stopped
    depends_on:
      - backend
    volumes:
      - ./envoy/envoy.yaml:/etc/envoy/envoy.yaml:ro
    ports:
      - "8081:8081"
      - "9901:9901"
    command: ["-c", "/etc/envoy/envoy.yaml", "--log-level", "info"]
    networks:
      - vaxcare-network

volumes:
  mysql_data:

networks:
  vaxcare-network:
    driver: bridge
